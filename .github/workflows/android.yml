name: 构建 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 测试并构建 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 配置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 API 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: 配置 Gradle 缓存并校验 Wrapper
        uses: gradle/actions/setup-gradle@v6

      - name: 运行单元测试并构建 APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: 在 API 35 模拟器运行图片导入测试
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: SettingsAnimeBackground-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: 上传单元测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
